  const apps={files:{name:'Files',icon:'folder',tone:'yellow',w:800,h:550},case:{name:'Case',icon:'case',tone:'coral',w:800,h:630},sources:{name:'Sources',icon:'file',tone:'white',w:680,h:520},notes:{name:'Notes',icon:'note',tone:'lilac',w:620,h:510},tasks:{name:'Follow-ups',icon:'tasks',tone:'white',w:620,h:510},editor:{name:'Document',icon:'file',tone:'white',w:680,h:540},settings:{name:'Appearance',icon:'settings',tone:'charcoal',w:660,h:520}};
  const sourceData={agreement:{title:'Signed agreement · §3.2',date:'May 18, 2026',kind:'Signed PDF · freelancer file',quote:'Final Asset Package containing: (a) a Web & Social pack of PNG and JPG files; (b) master vector source files in AI, SVG and EPS formats suitable for print, signage and merchandise; (c) a print-ready PDF brand guide; and (d) a signed Assignment of Copyright letter.',limit:'The agreement defines the promised scope. It does not establish which files were received.'},transfer:{title:'File transfer export · L3–L6',date:'July 01–31, 2026',kind:'Transfer service export',quote:'Web & Social pack: 2 downloads recorded on July 01 and July 09. Master vectors + rights ZIP: 0 downloads recorded during the link life.',limit:'This records events in this transfer service. It cannot establish delivery or access by other means.'},report:{title:'Client report · F1',date:'September 22, 2026',kind:'Website contact form · client-submitted',quote:'The sign company says the files we have are only good for screens.',limit:'This message is unread and the sign-maker account has not been independently verified.'},reissue:{title:'Re-issue term · §7.2',date:'May 18, 2026',kind:'Signed PDF · freelancer file',quote:'For 12 months after delivery, Studio will re-issue the Final Asset Package on request at no charge, within 2 business days of the request.',limit:'The source establishes a route to resolve access. It does not show whether a request was made.'}};
  const requestedTheme=new URLSearchParams(location.search).get('theme');
  const storedTheme=localStorage.getItem('studio-os-theme-v2');
  const validThemes=['porcelain','chalk','graphite'];
  const state={windows:new Map(),z:20,active:null,folder:'desk',documentId:null,documents:load('studio-os-documents',[]),caseTab:'bank',source:'agreement',tasks:load('studio-os-tasks',[]),note:load('studio-os-note',{title:'Case notes',body:''}),theme:validThemes.includes(requestedTheme)?requestedTheme:(validThemes.includes(storedTheme)?storedTheme:'chalk')};
  function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
  function persist(){const scope=state.caseId?`fd-desk-${state.caseId}-`:'studio-os-';localStorage.setItem(scope+'tasks',JSON.stringify(state.tasks));localStorage.setItem(scope+'note',JSON.stringify(state.note));localStorage.setItem('studio-os-documents',JSON.stringify(state.documents))}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
  function art(id){return `<span class="icon-art icon-${id}">${glyph(id)}</span>`}
  function refreshDock(){const ids=['files','case','sources','notes','tasks','settings'];if(state.windows.has('editor'))ids.splice(2,0,'editor');document.getElementById('dock').innerHTML=`<button class="dock-item" data-open="launcher" data-tooltip="App launcher" aria-label="App launcher"><span class="icon-art icon-grid">${glyph('grid')}</span></button><div class="dock-sep"></div>`+ids.map(id=>`<button class="dock-item ${state.windows.has(id)&&!state.windows.get(id).classList.contains('hidden')?'running':''}" data-open="${id}" data-tooltip="${apps[id].name}" aria-label="Open ${apps[id].name}">${art(id)}</button>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>b.dataset.open==='launcher'?toggleLauncher():openApp(b.dataset.open))}
  function renderDesktop(){document.getElementById('desktopIcons').innerHTML=['files','case','notes','tasks'].map(id=>`<button class="desktop-icon" data-open="${id}" data-tooltip="Open ${apps[id].name}" aria-label="Open ${apps[id].name}">${art(id)}<span>${apps[id].name}</span></button>`).join('');document.querySelectorAll('.desktop-icon').forEach(b=>b.onclick=()=>openApp(b.dataset.open));const openTasks=state.tasks.filter(t=>!t.done);document.getElementById('widgetTaskCount').innerHTML=`${openTasks.length} <i>↗</i>`;document.getElementById('quickTaskPreview').textContent=openTasks.length?`Next: ${openTasks[0].text}`:'Add a task without opening an app.'}
  function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});document.getElementById('todayNumber').textContent=String(d.getDate()).padStart(2,'0');document.getElementById('todayLabel').textContent=d.toLocaleDateString('en-US',{weekday:'long'});document.getElementById('todayMonth').textContent=d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
  function toggleLauncher(force){const p=document.getElementById('launcher');p.classList.toggle('show',force===undefined?!p.classList.contains('show'):force);if(p.classList.contains('show')){document.getElementById('launcherSearch').focus();renderLauncher()}}
  function renderLauncher(){const q=document.getElementById('launcherSearch').value.toLowerCase();const appRows=Object.keys(apps).filter(id=>id!=='editor'&&(apps[id].name.toLowerCase().includes(q)||id.includes(q))).map(id=>`<button class="menu-row" data-app="${id}">${art(id)}<span>${apps[id].name}</span><small>APP ↗</small></button>`).join('');const docRows=state.documents.filter(d=>d.name.toLowerCase().includes(q)).map(d=>`<button class="menu-row" data-doc="${d.id}"><span class="icon-art icon-editor">${glyph('editor')}</span><span>${escapeHtml(d.name)}</span><small>DOCUMENT ↗</small></button>`).join('');document.getElementById('launcherList').innerHTML=appRows+docRows||'<div class="menu-bottom">No matches</div>';document.querySelectorAll('.menu-row[data-app]').forEach(b=>b.onclick=()=>{toggleLauncher(false);openApp(b.dataset.app)});document.querySelectorAll('.menu-row[data-doc]').forEach(b=>b.onclick=()=>{toggleLauncher(false);state.documentId=b.dataset.doc;openApp('editor');renderApp('editor')})}
  function focusWindow(id){const w=state.windows.get(id);if(!w)return;w.style.zIndex=++state.z;document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.classList.add('active');state.active=id;document.getElementById('activeAppName').textContent=apps[id].name}
  function openApp(id){if(!apps[id])return;toggleLauncher(false);let w=state.windows.get(id);if(w){w.classList.remove('hidden');focusWindow(id);refreshDock();return}const a=apps[id];w=document.createElement('section');w.className='window';w.dataset.app=id;w.style.width=a.w+'px';w.style.height=a.h+'px';const offset=state.windows.size*27;w.style.left=`calc(50% - ${a.w/2}px + ${offset}px)`;w.style.top=`calc(50% - ${a.h/2}px + ${offset/2}px)`;w.innerHTML=`<div class="titlebar"><div class="traffic"><button title="Close" aria-label="Close window" data-control="close"></button><button title="Minimize" aria-label="Minimize window" data-control="minimize"></button><button title="Maximize" aria-label="Maximize window" data-control="maximize"></button></div><span class="window-title">${a.name}</span><span class="window-meta">CASE WORKSPACE</span></div><div class="window-body"></div>`;document.getElementById('os').appendChild(w);state.windows.set(id,w);w.addEventListener('pointerdown',()=>focusWindow(id));w.querySelectorAll('[data-control]').forEach(b=>b.onclick=e=>{e.stopPropagation();const action=b.dataset.control;if(action==='close'){w.remove();state.windows.delete(id);state.active=null;document.getElementById('activeAppName').textContent='Desktop'}else if(action==='minimize')w.classList.add('hidden');else w.classList.toggle('maximized');refreshDock()});makeDraggable(w);renderApp(id);focusWindow(id);refreshDock()}
  function makeDraggable(w){const bar=w.querySelector('.titlebar');let start=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;start={x:e.clientX,y:e.clientY,left:w.offsetLeft,top:w.offsetTop};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!start)return;w.style.left=Math.max(0,Math.min(innerWidth-100,start.left+e.clientX-start.x))+'px';w.style.top=Math.max(56,Math.min(innerHeight-100,start.top+e.clientY-start.y))+'px'});bar.addEventListener('pointerup',()=>start=null);bar.addEventListener('pointercancel',()=>start=null)}
  function renderApp(id){const w=state.windows.get(id);if(!w)return;if(window.liveDesk?.render(id,w))return;const b=w.querySelector('.window-body');if(id==='files')b.innerHTML=filesHTML();if(id==='case')b.innerHTML=caseHTML();if(id==='sources')b.innerHTML=sourcesHTML();if(id==='notes')b.innerHTML=notesHTML();if(id==='tasks')b.innerHTML=tasksHTML();if(id==='editor')b.innerHTML=editorHTML();if(id==='settings')b.innerHTML=settingsHTML();bindApp(id,w);bindDocs(w)}
  function filesHTML(){const home=state.folder==='desk',personal=state.folder==='personal';const title=home?'My files':personal?'My documents':'Halden Coffee Roasters';return `<div class="app-layout"><aside class="app-side"><div class="side-heading">Locations</div><button class="side-row ${home?'selected':''}" data-folder="desk">${svg('grid')} My desk</button><button class="side-row ${personal?'selected':''}" data-folder="personal">${svg('folder')} My documents</button><button class="side-row ${!home&&!personal?'selected':''}" data-folder="halden">${svg('folder')} Halden Coffee</button><div class="side-note">Your documents stay in this browser. Halden records are seeded samples, separate from PayPal.</div></aside><div class="app-main"><div class="app-kicker">FILES / ${home?'MY DESK':personal?'MY DOCUMENTS':'HALDEN COFFEE'}</div><h2 class="app-heading">${title}</h2><p class="app-sub">${home?'Your local workspace and case records.':personal?'Create and edit private text documents.':'Four source excerpts in this seeded case file.'}</p>${home?`<div class="file-grid"><button class="file-tile" data-folder="personal">${svg('folder')}<div><strong>My documents</strong><small>${state.documents.length} local file${state.documents.length===1?"":"s"}</small></div></button><button class="file-tile" data-folder="halden">${svg('folder')}<div><strong>Halden Coffee</strong><small>4 records · demo</small></div></button><button class="file-tile" data-open-app="notes">${svg('note')}<div><strong>Personal notes</strong><small>Private to this browser</small></div></button></div>`:personal?`<form class="task-add" id="docForm"><input class="task-input" id="docInput" placeholder="Document name…" aria-label="Document name" required><button class="cta">New document</button></form>${state.documents.length?`<div class="file-list">${state.documents.map(d=>`<button class="file-row" data-document="${d.id}">${svg('file')}<span><strong>${escapeHtml(d.name)}</strong><small>Text document · saved locally</small></span><em>Open ↗</em></button>`).join('')}</div>`:'<div class="task-empty">No documents yet. Create one above to start writing.</div>'}`:`<div class="file-list">${Object.entries(sourceData).map(([key,s])=>`<button class="file-row" data-source="${key}">${svg('file')}<span><strong>${s.title}</strong><small>${s.kind} · excerpt</small></span><em>${s.date}</em></button>`).join('')}</div><div class="actions"><button class="cta" data-open-app="case">Open case workspace →</button></div>`}</div></div>`}
  function caseHTML(){const client=state.caseTab==='client';return `<div class="app-layout"><aside class="app-side"><div class="side-heading">Case workspace</div><button class="side-row selected">${svg('case')} Overview</button><button class="side-row" data-open-app="sources">${svg('file')} Sources</button><button class="side-row" data-open-app="tasks">${svg('tasks')} Follow-ups</button><div class="side-note">External card chargeback · “Not as described”<br><br>No case deadline is shown in the seeded record.</div></aside><div class="app-main"><div class="case-top"><div><div class="app-kicker">OPEN REVIEW · SEEDED DEMO</div><h2 class="app-heading">Halden Coffee Roasters</h2><p class="app-sub">Brand identity package · external card chargeback</p></div><div class="amount"><small>In dispute</small>$2,400</div></div><div class="case-tabs"><button class="${!client?'on':''}" data-tab="bank">Bank review</button><button class="${client?'on':''}" data-tab="client">Client resolution</button></div><div class="case-content">${client?`<div class="finding"><span class="finding-n">01</span><div><strong>What files does the sign-maker have?</strong><p>Request the exact file list and required formats before treating the report as verified.</p></div><button class="source-pill" data-source="report">F1 ↗</button></div><div class="finding"><span class="finding-n">02</span><div><strong>Check the re-issue route</strong><p>The agreement provides a re-issue term; the record does not show whether it was requested.</p></div><button class="source-pill" data-source="reissue">§7.2 ↗</button></div><div class="actions"><button class="cta" data-task="Ask for the sign-maker's exact file list">Add follow-up</button><button class="secondary" data-open-app="tasks">See follow-ups</button></div>`:`<div class="finding"><span class="finding-n">01</span><div><strong>The promise</strong><p>Signed scope includes screen assets and print-ready masters.</p></div><button class="source-pill" data-source="agreement">§3.2 ↗</button></div><div class="finding"><span class="finding-n">02</span><div><strong>The recorded transfer</strong><p>Two web-pack downloads; no master-ZIP download event in this service.</p></div><button class="source-pill" data-source="transfer">L3–L6 ↗</button></div><div class="finding"><span class="finding-n">03</span><div><strong>The client report</strong><p>Sign-maker concern is client-submitted, unread, and unverified.</p></div><button class="source-pill" data-source="report">F1 ↗</button></div><div class="unknown-card"><b>STILL OPEN</b><p>Which files reached the sign-maker? The transfer export alone cannot answer that.</p></div><div class="actions"><button class="cta" data-open-app="sources">Inspect source records</button><button class="secondary" data-open-app="tasks">Plan follow-up</button></div>`}</div></div></div>`}
  function sourcesHTML(){const s=sourceData[state.source];return `<div class="app-layout"><aside class="app-side"><div class="side-heading">Source records</div>${Object.entries(sourceData).map(([key,v])=>`<button class="side-row ${state.source===key?'selected':''}" data-source="${key}">${svg('file')} ${key==='agreement'?'Agreement':key==='transfer'?'Transfer log':key==='report'?'Client report':'Re-issue term'}</button>`).join('')}<div class="side-note">Seeded demo extracts. Inspect the original source before using a claim in a real response.</div></aside><div class="app-main"><div class="app-kicker">SOURCE INSPECTOR · DEMO EXTRACT</div><h2 class="app-heading">${s.title}</h2><p class="app-sub">${s.kind} · ${s.date}</p><div class="source-detail"><h3>Record summary</h3><p>${s.quote}</p><div class="caution"><strong>Evidence limit</strong><br>${s.limit}</div></div><div class="actions"><button class="secondary" data-open-app="case">Back to case</button><button class="secondary" data-open-app="notes">Open notes</button></div></div></div>`}
  function notesHTML(){return `<div class="app-main editable-area"><div class="note-toolbar"><span class="app-kicker">PRIVATE NOTES</span><span class="save-status" id="noteStatus">Saved in this browser</span></div><input class="note-title" id="noteTitle" aria-label="Note title" value="${escapeHtml(state.note.title)}"><textarea class="note-text" id="noteBody" aria-label="Note content" placeholder="Write what you want to remember about the case…">${escapeHtml(state.note.body)}</textarea><p class="app-sub" style="margin-top:11px">Your notes stay in this browser. They are not submitted to AI, PayPal, or the client.</p></div>`}
  function editorHTML(){const d=state.documents.find(x=>x.id===state.documentId);if(!d)return `<div class="app-main"><h2 class="app-heading">No document selected</h2><button class="secondary" data-open-app="files">Open Files</button></div>`;return `<div class="app-main editable-area"><div class="note-toolbar"><span class="app-kicker">MY DOCUMENTS / TEXT FILE</span><span class="save-status" id="docStatus">Saved in this browser</span></div><input class="note-title" id="documentTitle" aria-label="Document title" value="${escapeHtml(d.name)}"><textarea class="note-text" id="documentBody" aria-label="Document content" placeholder="Start writing…">${escapeHtml(d.body)}</textarea><div class="actions" style="justify-content:space-between"><span class="app-sub">Private to this browser</span><button class="secondary" id="deleteDocument">Delete document</button></div></div>`}
  function tasksHTML(){return `<div class="app-main"><div class="app-kicker">PERSONAL FOLLOW-UPS</div><h2 class="app-heading">Keep the next step clear.</h2><p class="app-sub">Private checklist for this seeded case. No response deadline is inferred.</p><form class="task-add" id="taskForm"><input class="task-input" id="taskInput" placeholder="Add a follow-up…" aria-label="New follow-up" required><button class="cta">Add</button></form><div>${state.tasks.length?state.tasks.map((t,i)=>`<div class="task-row ${t.done?'done':''}"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''} aria-label="Complete ${escapeHtml(t.text)}"><span>${escapeHtml(t.text)}</span><button data-task-delete="${i}" title="Delete follow-up" aria-label="Delete ${escapeHtml(t.text)}">×</button></div>`).join(''):'<div class="task-empty">Your list is clear. Add a question or action above.</div>'}</div><p class="app-sub" style="margin-top:22px">Saved only in this browser.</p></div>`}
  function settingsHTML(){return `<div class="app-main"><div class="app-kicker">PERSONAL SETTINGS</div><h2 class="app-heading">Make it yours.</h2><p class="app-sub">Each theme updates the desktop, windows, text, controls, and menus.</p><div class="themes">${[['porcelain','Porcelain','Soft light · oxblood','linear-gradient(125deg,#e6e4de 48%,#cecfc9 48%,#f5f3ee 74%)','#914b3c'],['chalk','Chalk','Cool light · deep teal','linear-gradient(125deg,#dce4e5 48%,#adbec2 48%,#f1f4f2 74%)','#47756d'],['graphite','Graphite','Deep charcoal · brass','linear-gradient(125deg,#192327 48%,#344044 48%,#0e191c 74%)','#d6b574']].map(([id,name,sub,bg,accent])=>`<button class="theme-card ${state.theme===id?'selected':''}" data-theme-choice="${id}"><div class="theme-preview" style="background:${bg}"><span></span><span></span><span style="background:${accent}"></span></div>${name}<small>${sub}</small></button>`).join('')}</div><div class="app-rule"></div><div class="settings-row"><span>Workspace</span><span>Freelancer Defender</span></div><div class="settings-row"><span>Preview data</span><span>Current case follows your selection</span></div><div class="settings-row"><span>Personal storage</span><span>This browser only</span></div></div>`}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function bindApp(id,w){w.querySelectorAll('[data-open-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.openApp));w.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{state.folder=b.dataset.folder;renderApp('files')});w.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{state.source=b.dataset.source;openApp('sources');renderApp('sources')});w.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.caseTab=b.dataset.tab;renderApp('case')});w.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{state.tasks.push({text:b.dataset.task,done:false});persist();renderDesktop();toast('Added to follow-ups');openApp('tasks');renderApp('tasks')});w.querySelectorAll('[data-task-check]').forEach(b=>b.onchange=()=>{state.tasks[+b.dataset.taskCheck].done=b.checked;persist();renderApp('tasks');renderDesktop()});w.querySelectorAll('[data-task-delete]').forEach(b=>b.onclick=()=>{state.tasks.splice(+b.dataset.taskDelete,1);persist();renderApp('tasks');renderDesktop()});const f=w.querySelector('#taskForm');if(f)f.onsubmit=e=>{e.preventDefault();const input=f.querySelector('input');const value=input.value.trim();if(!value)return;state.tasks.push({text:value,done:false});persist();renderApp('tasks');renderDesktop();toast('Follow-up added')};const title=w.querySelector('#noteTitle'),body=w.querySelector('#noteBody');if(title&&body){const save=()=>{state.note={title:title.value,body:body.value};persist();const s=w.querySelector('#noteStatus');if(s)s.textContent='Saved just now'};title.oninput=save;body.oninput=save}w.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.themeChoice;document.body.dataset.theme=state.theme;localStorage.setItem('studio-os-theme-v2',state.theme);renderApp('settings');toast('Theme updated')})}
  function bindDocs(w){const form=w.querySelector('#docForm');if(form)form.onsubmit=e=>{e.preventDefault();const name=form.querySelector('input').value.trim();if(!name)return;const d={id:String(Date.now()),name,body:''};state.documents.push(d);state.documentId=d.id;persist();renderApp('files');openApp('editor');renderApp('editor');toast('Document created')};w.querySelectorAll('[data-document]').forEach(b=>b.onclick=()=>{state.documentId=b.dataset.document;openApp('editor');renderApp('editor')});const title=w.querySelector('#documentTitle'),body=w.querySelector('#documentBody');if(title&&body){const save=()=>{const d=state.documents.find(x=>x.id===state.documentId);if(!d)return;d.name=title.value;d.body=body.value;persist();const s=w.querySelector('#docStatus');if(s)s.textContent='Saved just now'};title.oninput=save;body.oninput=save}const del=w.querySelector('#deleteDocument');if(del)del.onclick=()=>{state.documents=state.documents.filter(x=>x.id!==state.documentId);state.documentId=null;persist();w.querySelector('[data-control="close"]').click();state.folder='personal';openApp('files');renderApp('files');toast('Document deleted')}}
  function showDesktop(){state.windows.forEach(w=>w.classList.add('hidden'));state.active=null;document.getElementById('activeAppName').textContent='Desktop';toggleLauncher(false);refreshDock()}
  window.liveDeskCore={state,apps,svg,art,escapeHtml,openApp,renderApp,renderDesktop,refreshDock,bindApp,persist,toast};
  document.body.dataset.theme=state.theme;
  renderDesktop();refreshDock();updateClock();setInterval(updateClock,30000);
  document.getElementById('startButton').onclick=()=>toggleLauncher();
  document.getElementById('searchButton').onclick=()=>toggleLauncher(true);
  document.getElementById('settingsButton').onclick=()=>openApp('settings');
  document.getElementById('showDesktopButton').onclick=showDesktop;
  document.getElementById('launcherSearch').oninput=renderLauncher;
  document.getElementById('quickTaskForm').onsubmit=e=>{e.preventDefault();const input=document.getElementById('quickTaskInput');const value=input.value.trim();if(!value)return;state.tasks.push({text:value,done:false});persist();input.value='';renderDesktop();if(state.windows.has('tasks'))renderApp('tasks');toast('Added to follow-ups')};
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toggleLauncher(true)}if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key.toLowerCase()==='d'){e.preventDefault();showDesktop()}if(e.key==='Escape')toggleLauncher(false)});
  document.getElementById('desktop').onclick=e=>{if(e.target.id==='desktop')toggleLauncher(false)};
  document.addEventListener('click',e=>{if(e.target.matches('[data-control="close"],[data-control="minimize"]'))setTimeout(()=>{const visible=[...state.windows].filter(([,w])=>!w.classList.contains('hidden')).sort((a,b)=>(+b[1].style.zIndex)-(+a[1].style.zIndex));if(visible.length)focusWindow(visible[0][0]);else{state.active=null;document.getElementById('activeAppName').textContent='Desktop'}},0)});
  const requestedApp=new URLSearchParams(location.search).get('app');
  window.requestedDeskApp=['files','case','sources','notes','tasks','settings'].includes(requestedApp)?requestedApp:'files';
</script>
