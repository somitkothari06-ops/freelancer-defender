# Render Blueprint: Render reads this file to create the web service.
# In the Render dashboard: New + -> Blueprint -> pick this GitHub repo.
# Render will ask for the values marked "sync: false" (your secret keys) during setup.
services:
  - type: web
    name: freelancer-defender
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: SESSION_SECRET
        generateValue: true
      - key: LIVE_ACTION_EMAILS
        sync: false
